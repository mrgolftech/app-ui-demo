name: Deploy React UI Demo to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['src/**','public/**','index.html','package.json','tsconfig.json','vite.config.ts','.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and compile
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Vite dist output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        uses: actions/deploy-pages@v4
