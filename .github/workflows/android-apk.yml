name: Android Signed Release APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Check fixed-signing configuration
        env:
          RELEASE_KEY_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_VAR_EXISTS: ${{ vars.ANDROID_RELEASE_KEYSTORE_B64 != '' }}
          PASSWORD_VAR_EXISTS: ${{ vars.ANDROID_RELEASE_STORE_PASSWORD != '' }}
        run: |
          if [[ -z "$RELEASE_KEY_B64" || -z "$RELEASE_STORE_PASSWORD" ]]; then
            echo "::error::Release signing credentials unavailable to this workflow: check the TWO Repository Secrets (not Variables or Environment secrets)."
            if [[ "$KEY_VAR_EXISTS" == "true" || "$PASSWORD_VAR_EXISTS" == "true" ]]; then
              echo "::error::Found matching Actions VARIABLES. Move credentials to Secrets: variables are not appropriate for private signing keys."
            fi
            exit 1
          fi
          echo "Both protected Repository Secrets are readable (values not printed)."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify release-signing Gradle patch
        run: node --test tests/android-release.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK
        run: |
          sdkmanager --version
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Compile offline React UI
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Create generated Android shell
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs
          node scripts/patch-android-release.mjs
          grep -F 'android:screenOrientation="sensorLandscape"' android/app/src/main/AndroidManifest.xml
          grep -F 'controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars())' android/app/src/main/java/com/mrgolftech/kidsvisualdemo/MainActivity.java
          grep -F 'signingConfig signingConfigs.ciRelease' android/app/build.gradle

      - name: Restore fixed keystore from GitHub Secrets
        env:
          RELEASE_KEY_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          install -d -m 700 android/app/signing
          printf '%s' "$RELEASE_KEY_B64" | base64 --decode > android/app/signing/release.p12
          chmod 600 android/app/signing/release.p12
          test -s android/app/signing/release.p12

      - name: Verify fixed release certificate
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: |
          CERT_SHA256="$(keytool -list -v -keystore android/app/signing/release.p12 -storetype PKCS12 -storepass:env RELEASE_STORE_PASSWORD -alias kids-ui-demo-release | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          EXPECTED_SHA256="7D:0D:B4:5A:5B:AA:77:32:59:11:EB:66:42:6E:A5:5D:7D:DA:4F:95:33:B6:28:E8:94:9B:63:EC:39:64:1C:2A"
          if [[ "$CERT_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Release signing certificate is not the original fixed identity"
            exit 1
          fi
          echo "Release certificate fingerprint verified"

      - name: Build signed Release APK
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/app/signing/release.p12
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Verify release signing and APK integrity
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: app-ui-demo-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
