name: Android Signed Release APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check fixed-signing configuration
        env:
          RELEASE_KEY_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: |
          if [[ -z "$RELEASE_KEY_B64" || -z "$RELEASE_STORE_PASSWORD" ]]; then
            echo "::error::Configure ANDROID_RELEASE_KEYSTORE_B64 and ANDROID_RELEASE_STORE_PASSWORD in Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK
        run: |
          sdkmanager --version
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Compile offline React UI
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Create generated Android shell
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs
          node scripts/patch-android-release.mjs
          grep -F 'android:screenOrientation="sensorLandscape"' android/app/src/main/AndroidManifest.xml
          grep -F 'controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars())' android/app/src/main/java/com/mrgolftech/kidsvisualdemo/MainActivity.java
          grep -F 'signingConfig signingConfigs.ciRelease' android/app/build.gradle

      - name: Restore fixed keystore from GitHub Secrets
        env:
          RELEASE_KEY_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          install -d -m 700 android/app/signing
          printf '%s' "$RELEASE_KEY_B64" | base64 --decode > android/app/signing/release.p12
          chmod 600 android/app/signing/release.p12
          test -s android/app/signing/release.p12

      - name: Build signed Release APK
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/app/signing/release.p12
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Verify release signing and APK integrity
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: app-ui-demo-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
