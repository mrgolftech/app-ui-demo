name: React UI Visual Layout Audit
on:
  push:
    branches: [main]
    paths: ['src/**','public/**','tests/**','index.html','package.json','tsconfig.json','vite.config.ts','.github/workflows/visual-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and compile
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve production build
        run: npm run preview > /tmp/ui-demo-preview.log 2>&1 &
      - name: Test five pages at seven viewport sizes
        run: |
          sleep 2
          npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-ui-demo-visual-evidence
          path: visual-evidence/
          retention-days: 30
